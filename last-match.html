<title>Last Match</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Nunito:wght@600;800&display=swap">
<style>
  :root{
    --bg:#2b1e5e; --bg2:#16103a; --board:#1c1447; --cell:#2a1f63; --cell2:#312672; --rim:#3d3190;
    --ink:#fff6e5; --muted:#b9adde; --gold:#ffd23f; --gold-d:#a8731a; --danger:#ff3b5c; --ok:#4ee089; --sky:#41b6ff;
    --font-d:'Fredoka','Nunito',system-ui,sans-serif; --font-b:'Nunito',system-ui,sans-serif;
  }
  html,body{height:100%}
  body{margin:0;box-sizing:border-box;min-height:100%;padding-inline:16px;padding-block:14px;
    background:radial-gradient(circle at 50% -10%,#45308f 0%,var(--bg) 40%,var(--bg2) 100%) fixed;
    color:var(--ink);font-family:var(--font-b);font-weight:600;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  #app{max-width:540px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
  .hud{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap}
  .brand{font-family:var(--font-d);font-weight:700;font-size:1.7rem;line-height:1;letter-spacing:.02em;color:var(--gold);
    text-shadow:0 3px 0 #7a2a55,0 6px 14px rgba(0,0,0,.35)}
  .brand small{display:block;font-family:var(--font-b);font-size:.68rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-shadow:none;margin-top:6px}
  .stats{display:flex;gap:12px;font-variant-numeric:tabular-nums;flex-wrap:wrap}
  .stat{display:flex;flex-direction:column;align-items:center;min-width:46px}
  .stat b{font-family:var(--font-d);font-weight:700;font-size:1.3rem;line-height:1}
  .stat span{font-size:.62rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-top:3px}
  .stat.warn b{color:var(--danger)}
  .boardwrap{position:relative;background:var(--board);border-radius:22px;padding:8px;
    box-shadow:0 14px 34px rgba(0,0,0,.4),inset 0 0 0 3px var(--rim)}
  canvas#board{display:block;width:100%;border-radius:14px;touch-action:none;cursor:pointer;outline:none}
  .dock{display:flex;align-items:center;gap:12px}
  .meterwrap{flex:1;display:flex;flex-direction:column;gap:4px}
  .meterwrap span{font-size:.62rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
  .meter{height:14px;background:#140e33;border-radius:8px;overflow:hidden;box-shadow:inset 0 2px 4px rgba(0,0,0,.5)}
  .meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff9f43,var(--gold));transition:width .12s linear}
  .slots{display:flex;gap:6px}
  .slot{width:50px;height:50px;border-radius:14px;border:3px dashed #4b3f95;background:#241a52;color:var(--ink);
    font-size:1.35rem;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;padding:0;font-family:var(--font-d)}
  .slot.filled{border-style:solid;border-color:var(--gold);background:#3a2d7a;box-shadow:0 4px 0 #14102e}
  .slot.filled:active{transform:translateY(3px);box-shadow:0 1px 0 #14102e}
  .slot:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
  .slot small{position:absolute;bottom:1px;right:5px;font-size:.6rem;color:var(--muted);font-family:var(--font-b)}
  .chips{display:flex;gap:6px;min-height:24px;flex-wrap:wrap;align-items:center;font-size:.72rem}
  .chip{font-weight:800;padding:3px 9px;border-radius:999px;text-transform:uppercase;letter-spacing:.06em;color:#1b1040}
  .chip.shield{background:var(--gold)} .chip.glitch{background:var(--sky)} .chip.freeze{background:#bfe9ff} .chip.supply{background:var(--danger);color:#fff} .chip.level{background:#4b3f95;color:var(--ink)} .chip.rush{background:#ff3b5c;color:#fff} .chip.shift{background:#c77dff;color:#1b1040}
  .hint{font-size:.72rem;color:var(--muted);text-align:center;line-height:1.5}
  .hint kbd{font-family:var(--font-b);background:#3a2d7a;border-radius:5px;padding:1px 5px;color:var(--ink);box-shadow:0 2px 0 #14102e}
  .overlay{position:absolute;inset:8px;background:rgba(18,11,48,.93);border-radius:14px;display:flex;flex-direction:column;
    align-items:center;justify-content:flex-start;text-align:center;padding:16px;gap:10px;overflow:auto}
  .overlay > :first-child{margin-top:auto} .overlay > :last-child{margin-bottom:auto}
  .overlay h1{font-family:var(--font-d);font-weight:700;font-size:2.2rem;margin:0;line-height:1;color:var(--gold);text-shadow:0 4px 0 #7a2a55;text-wrap:balance}
  .overlay h2{font-family:var(--font-d);font-weight:700;font-size:1.4rem;margin:0;color:var(--ink);text-wrap:balance}
  .overlay p{margin:0}
  .tag{font-size:.86rem;color:#e3dcff;max-width:42ch}
  .tierbar{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;max-width:420px}
  .tierbar .nav{background:#2a1f63;border:2px solid #4b3f95;color:var(--ink);border-radius:10px;width:36px;height:36px;font-size:1.1rem;cursor:pointer;flex:none;font-family:var(--font-d)}
  .tierbar .nav:disabled{opacity:.3;cursor:not-allowed}
  .tierbar .nav:focus-visible{outline:3px solid var(--sky)}
  .tiername{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
  .tiername b{font-family:var(--font-d);font-size:1.15rem;color:var(--gold)}
  .tiername span{font-size:.62rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
  .tierdesc{font-size:.78rem;color:#e3dcff;max-width:42ch;min-height:2.4em}
  .levels{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;width:100%;max-width:420px}
  .lvl{background:#2a1f63;border:2px solid #4b3f95;border-radius:10px;padding:6px 2px;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;font-family:var(--font-b);box-shadow:0 3px 0 #14102e;min-width:0}
  .lvl b{font-family:var(--font-d);font-size:1.05rem;line-height:1}
  .lvl em{font-style:normal;font-size:.55rem;color:var(--gold);white-space:nowrap}
  .lvl.done{border-color:var(--ok)} .lvl.done em{color:var(--ok)}
  .lvl.next{border-color:var(--gold);background:#3a2d7a}
  .lvl.locked{opacity:.4;cursor:not-allowed}
  .lvl:active:not(.locked){transform:translateY(2px);box-shadow:0 1px 0 #14102e}
  .lvl:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
  .endless{width:100%;max-width:420px;display:flex;justify-content:space-between;align-items:center;gap:10px;background:linear-gradient(90deg,#3a2d7a,#4b2a7a);border:2px solid #c77dff;border-radius:12px;padding:10px 14px;color:var(--ink);cursor:pointer;font-family:var(--font-b);box-shadow:0 3px 0 #14102e;text-align:left}
  .endless b{font-family:var(--font-d);font-size:1.15rem}
  .endless span{font-size:.72rem;color:var(--muted)}
  .endless em{font-style:normal;color:var(--gold);font-size:.75rem;white-space:nowrap}
  .endless:active{transform:translateY(2px);box-shadow:0 1px 0 #14102e}
  .endless:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
  details{width:100%;max-width:420px;text-align:left}
  summary{cursor:pointer;font-weight:800;color:var(--gold);font-size:.85rem;list-style:none;text-align:center}
  summary::after{content:' ▾'}
  details[open] summary::after{content:' ▴'}
  .help{font-size:.8rem;color:#e3dcff;line-height:1.5;display:flex;flex-direction:column;gap:6px;margin-top:8px}
  .help b{color:var(--gold)}
  .legend{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:6px}
  .legend div{display:flex;flex-direction:column;align-items:center;font-size:.58rem;color:var(--muted);gap:3px;text-transform:uppercase;letter-spacing:.05em;width:62px}
  .legend canvas{width:40px;height:40px}
  .btnrow{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .btn{font-family:var(--font-d);font-size:1.15rem;font-weight:700;background:var(--gold);color:#3a1e4d;border:0;border-radius:14px;
    padding:11px 24px;box-shadow:0 5px 0 var(--gold-d);cursor:pointer;margin-top:6px}
  .btn.alt{background:#3a2d7a;color:var(--ink);box-shadow:0 5px 0 #14102e}
  .btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--gold-d)}
  .btn.alt:active{box-shadow:0 2px 0 #14102e}
  .btn:focus-visible{outline:3px solid var(--sky);outline-offset:3px}
  .result{display:flex;gap:16px;font-variant-numeric:tabular-nums;margin-top:4px;flex-wrap:wrap;justify-content:center}
  .result div{display:flex;flex-direction:column;align-items:center}
  .result b{font-family:var(--font-d);font-size:1.5rem;line-height:1}
  .result span{font-size:.62rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-top:3px}
  .cause{color:var(--danger);font-weight:800}
  .best{color:var(--ok);font-weight:800}
  .newfeat{background:#3a2d7a;border:2px solid var(--gold);border-radius:12px;padding:8px 12px;font-size:.8rem;max-width:42ch}
  .newfeat b{color:var(--gold)}
  .mute{position:absolute;top:14px;right:14px;background:#241a52;border:2px solid #4b3f95;color:var(--ink);border-radius:10px;padding:4px 8px;font-size:.75rem;cursor:pointer;font-family:var(--font-b);font-weight:800;z-index:2}
  @media (prefers-reduced-motion:reduce){ .meter i{transition:none} }
  @media (max-width:420px){ .stats{gap:8px} .stat{min-width:40px} .brand{font-size:1.45rem} .overlay h1{font-size:1.9rem} }
</style>

<div id="app">
  <div class="hud">
    <div class="brand">LAST MATCH<small id="lvl-name">reverse match-3</small></div>
    <div class="stats">
      <div class="stat"><b id="st-score">0</b><span>Score</span></div>
      <div class="stat"><b id="st-time">0:00</b><span>Survived</span></div>
      <div class="stat" id="st-supply-wrap"><b id="st-supply">–</b><span>Gem supply</span></div>
      <div class="stat" id="st-moves-wrap"><b id="st-moves">–</b><span>AI moves left</span></div>
      <div class="stat"><b id="st-dodges">0</b><span>Dodged</span></div>
    </div>
  </div>

  <div class="boardwrap">
    <canvas id="board" aria-label="Game board" tabindex="0"></canvas>
    <div class="overlay" id="overlay"></div>
    <button class="mute" id="mute" type="button" aria-label="Toggle sound">🔊</button>
  </div>

  <div class="dock">
    <div class="meterwrap"><span>Survival meter · earns a power-up</span><div class="meter"><i id="meter"></i></div></div>
    <div class="slots" id="slots">
      <button class="slot" type="button" data-i="0" aria-label="Power-up slot 1"><small>1</small></button>
      <button class="slot" type="button" data-i="1" aria-label="Power-up slot 2"><small>2</small></button>
      <button class="slot" type="button" data-i="2" aria-label="Power-up slot 3"><small>3</small></button>
    </div>
  </div>
  <div class="chips" id="chips"></div>
  <div class="hint"><kbd>←</kbd><kbd>↑</kbd><kbd>↓</kbd><kbd>→</kbd> or WASD or swipe to swap yourself · <kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> use a power-up · <kbd>P</kbd> pause · <kbd>Esc</kbd> menu</div>
</div>

<script>
(() => {
'use strict';

// ============================================================
// TUNING
// ============================================================
const AI_SPEED = 1.0;          // global multiplier on top of each level's speed. 2 = everything twice as fast.
const AI_PACE = {
  firstMove: 1.0,     // seconds before the very first swipe
  thinkStart: 1.0,    // gap between swipes at the start of a round
  thinkEnd: 0.35,     // gap between swipes once fully ramped
  teleStart: 0.55,    // how long the hand hovers before swiping, at the start
  teleEnd: 0.25,      // same, once fully ramped
  rampSeconds: 60,    // seconds until the AI reaches full pace
  aggroStart: 0.6,    // chance it goes for you when it can, at the start
  aggroEnd: 0.95,
};
const METER_TIME = 9;          // seconds of survival per power-up
const MAX_SLOTS = 3;
const POP_MS = 230;
const SWAP_SPEED = 9;          // cells per second
const GRAV = 45;               // cells per second^2
const SCORE = { perSecond: 10, dodge: 150, aiSwipe: 25, combo: 60, unlock: 40 };

// Campaign: 250 levels, one new mechanic every 25. Each tier keeps everything from the tiers before it.
const LEVELS_PER_TIER = 25;
const TIERS = [
  { name: 'Basics',          desc: 'Just you, the hand and plain matches. Three in a row clears, nothing more.', adds: {} },
  { name: 'Blasters',        desc: 'Four in a row makes a row or column blaster. Match it and it sweeps the whole line.', adds: { blasters: 1 } },
  { name: 'Bombs & Holes',   desc: 'An L or T shape makes a bomb that clears 3x3. Boards start having holes.', adds: { bombs: 1, holes: 1 } },
  { name: 'Color Bombs',     desc: 'Five in a row makes a color bomb. Swap it with any gem to wipe that color. Caged gems appear: matchable, not movable.', adds: { rainbow: 1, cages: 1 } },
  { name: 'Fog & Combos',    desc: 'Fogged gems hide their color until something clears next to them. Six in a row makes a cross. Swapping two specials sets off a combo.', adds: { fog: 1, cross: 1, combos: 1 } },
  { name: 'Diagonals',       desc: 'Diagonal blasters spawn from the supply. Locks also open on a timer.', adds: { diag: 1, timedUnlock: 1 } },
  { name: 'Seekers',         desc: 'Seekers spawn from the supply. When one goes off it blasts wherever you are standing.', adds: { seeker: 1 } },
  { name: 'Closing Cages',   desc: 'Cages close on random gems during play and the boards get bigger.', adds: { shifting: 1, big: 1 } },
  { name: 'Shapeshift',      desc: 'Your color changes every 15 seconds. Watch the countdown over your head.', adds: { shapeshift: 1 } },
  { name: 'Rush Hour',       desc: 'Every 20 seconds the hand goes into overdrive for five. Everything at once.', adds: { rush: 1 } },
];
const TOTAL_LEVELS = TIERS.length * LEVELS_PER_TIER;

// ============================================================
// DATA
// ============================================================
const GEMS = [
  { name: 'Ruby',     c: '#ff5470', d: '#9c0f36', l: '#ffd6de', shape: 'circle'  },
  { name: 'Amber',    c: '#ffb52e', d: '#a45500', l: '#fff0c2', shape: 'diamond' },
  { name: 'Jade',     c: '#4ee089', d: '#0f6f37', l: '#d6ffe6', shape: 'hex'     },
  { name: 'Sapphire', c: '#41b6ff', d: '#0a4f92', l: '#d3efff', shape: 'square'  },
  { name: 'Amethyst', c: '#c77dff', d: '#5e1a99', l: '#efdcff', shape: 'star'    },
];
const POWERUPS = {
  shield:  { name: 'Shield',  icon: '🛡️', desc: 'You cannot be matched for 6s' },
  glitch:  { name: 'Glitch',  icon: '⚡', desc: "AI's swipes fail for 5s" },
  freeze:  { name: 'Freeze',  icon: '❄️', desc: 'AI stops thinking for 4s' },
  shuffle: { name: 'Shuffle', icon: '🔀', desc: 'Reshuffle every gem but you' },
};
const CAUSES = {
  match:   'You got matched into a line of three.',
  H:       'A row blaster swept you away.',
  V:       'A column blaster swept you away.',
  cross:   'A cross blaster caught you at the junction.',
  diag:    'A diagonal blaster sliced through you.',
  bomb:    'You were caught in a bomb blast.',
  mega:    'A mega bomb flattened you.',
  seeker:  'A seeker hunted you down.',
  rainbow: 'A color bomb wiped out your color.',
  combo:   'A special combo tore through you.',
};
const SPECIAL_NAMES = { H: 'Row blaster', V: 'Column blaster', cross: 'Cross blaster', diag: 'Diagonal blaster', bomb: 'Bomb', mega: 'Mega bomb', seeker: 'Seeker', rainbow: 'Color bomb' };
const OPEN = 0, HOLE = 1, CAGE = 2, FOG = 3;

// ============================================================
// LEVEL GENERATOR
// ============================================================
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function tierOf(n) { return Math.min(TIERS.length - 1, Math.floor((n - 1) / LEVELS_PER_TIER)); }
function featsForTier(t) { const f = {}; for (let i = 0; i <= t; i++) Object.assign(f, TIERS[i].adds); return f; }

// Mask patterns. Each returns a function (r, c) -> true for cells it marks.
const HOLE_PATTERNS = [
  (R, C) => (r, c) => (r === 0 || r === R - 1) && (c === 0 || c === C - 1),
  (R, C) => (r, c) => (r <= 1 && (c <= 1 || c >= C - 2)) && !(r === 1 && (c === 1 || c === C - 2)),
  (R, C) => (r, c) => Math.abs(r - (R - 1) / 2) < 1 && Math.abs(c - (C - 1) / 2) < 1,
  (R, C) => (r, c) => (r === Math.floor(R / 2) || r === Math.floor(R / 2) - 1) && (c === 1 || c === C - 2),
  (R, C) => (r, c) => (r === Math.floor(R / 2)) && (c === 0 || c === C - 1),
  (R, C) => (r, c) => (r === R - 1) && (c === 0 || c === C - 1 || Math.abs(c - (C - 1) / 2) < 1),
  (R, C) => (r, c) => (r === 1 || r === R - 2) && (c === 1 || c === C - 2),
];
const CAGE_PATTERNS = [
  (R, C) => (r, c) => (r === 0 || r === R - 1) && (c <= 1 || c >= C - 2),
  (R, C) => (r, c) => (c === 0 || c === C - 1) && r >= 1 && r <= R - 2 && r % 2 === 1,
  (R, C) => (r, c) => Math.abs(r - (R - 1) / 2) <= 1.5 && Math.abs(c - (C - 1) / 2) <= 1.5 && !(Math.abs(r - (R - 1) / 2) < 1 && Math.abs(c - (C - 1) / 2) < 1),
  (R, C) => (r, c) => (r === 2 || r === R - 3) && (c === 2 || c === C - 3),
  (R, C) => (r, c) => r === 0 && c % 2 === 0,
  (R, C) => (r, c) => (r === 0 || r === R - 1) && Math.abs(c - (C - 1) / 2) < 1.5,
];
const FOG_PATTERNS = [
  (R, C) => (r, c) => r + c <= 1 || r + (C - 1 - c) <= 1,
  (R, C) => (r, c) => r + c <= 2 || r + (C - 1 - c) <= 2,
  (R, C) => (r, c) => (c === 0 || c === C - 1) && r >= 2 && r <= R - 3,
  (R, C) => (r, c) => r === R - 1 && (c <= 1 || c >= C - 2),
  (R, C) => (r, c) => r === 0 && (c <= 2 || c >= C - 3),
  (R, C) => (r, c) => (r === 1 || r === R - 2) && Math.abs(c - (C - 1) / 2) < 1.5,
];

function makeLevel(n) {
  const t = tierOf(n), k = (n - 1) % LEVELS_PER_TIER, p = k / (LEVELS_PER_TIER - 1), g = (n - 1) / (TOTAL_LEVELS - 1);
  const rng = mulberry32(n * 7919 + 13);
  const F = featsForTier(t);
  let cols = 8, rows = 8;
  if (t === 0) { cols = rows = k < 10 ? 7 : 8; }
  else if (t <= 2) { cols = rng() < .3 ? 9 : 8; rows = 8; }
  else if (t <= 6) { const pickB = rng(); cols = pickB < .4 ? 8 : 9; rows = pickB > .75 ? 9 : 8; }
  else { const pickB = rng(); cols = pickB < .5 ? 9 : 10; rows = 9; }
  const colors = n <= 8 ? 4 : 5;
  const speed = +(0.95 + g * 1.35 + p * 0.15).toFixed(2);
  const aiMoves = Math.round(36 + g * 74 + p * 8);
  const supply = Math.round(aiMoves * (3.3 + 3 * g)); // later tiers chain specials, so they need a deeper supply
  const spawn = {};
  if (F.cross) spawn.cross = .012 + .012 * g;
  if (F.diag) spawn.diag = .02 + .02 * (t === 5 ? p : 1);
  if (F.seeker) spawn.seeker = .02 + .025 * (t === 6 ? p : 1);
  // mask
  const mask = [];
  const marks = [];
  const addPattern = (lib, kind, count) => { const idxs = []; while (idxs.length < count) { const i = Math.floor(rng() * lib.length); if (!idxs.includes(i)) idxs.push(i); } for (const i of idxs) marks.push({ kind, f: lib[i](rows, cols) }); };
  if (F.holes) addPattern(HOLE_PATTERNS, '.', t === 2 ? (p < .4 ? 1 : 1 + (rng() < .5 ? 1 : 0)) : 1 + (rng() < .45 ? 1 : 0));
  if (F.cages) addPattern(CAGE_PATTERNS, 'L', t === 3 ? (p < .5 ? 1 : 2) : 1 + (rng() < .4 ? 1 : 0));
  if (F.fog) addPattern(FOG_PATTERNS, 'H', t === 4 ? (p < .5 ? 1 : 2) : 1);
  // the very first few levels of a tier go lighter on its new hazard
  const light = k < 3;
  for (let r = 0; r < rows; r++) {
    let row = '';
    for (let c = 0; c < cols; c++) {
      let ch = '#';
      for (const m of marks) { if (m.f(r, c)) { if (light && ch === '#' && (r + c) % 2) continue; ch = m.kind; } }
      row += ch;
    }
    mask.push(row);
  }
  // start cell: lowest open cell nearest the middle
  let start = null;
  for (let r = rows - 2; r >= 0 && !start; r--) for (let d = 0; d < cols && !start; d++) { for (const c of [Math.floor((cols - 1) / 2) + d, Math.floor((cols - 1) / 2) - d]) { if (c >= 0 && c < cols && mask[r][c] === '#') { start = [r, c]; break; } } }
  if (!start) start = [rows - 1, 0];
  const L = { id: n, name: 'Level ' + n, tier: t, tierName: TIERS[t].name, cols, rows, colors, aiMoves, supply, speed, start, mask, spawn, feats: F };
  if (F.timedUnlock) L.unlockEvery = Math.round(12 - 5 * g);
  if (F.shifting) L.cageEvery = Math.round(26 - 8 * p);
  if (F.shapeshift) L.shiftEvery = 15;

    combo++;

    const clear = expandClear(S.grid, runs, seeds);

    if (pl) {

    let announced = false;

      S.fx.push({ kind: 'ring', x: c + .5, y: r + .5, r0: .2, r1: 1.1, color: '#ffffff', t: 0, dur: .4 });

async function doSwap(A, B, who) {

  swapCells(A, B); await settle(); if (gen !== S.gen) return false;
  const seeds = swapSeeds(S.grid, A, B);
  if (seeds) { await resolveBoard([], seeds, who); return true; }
  const runs = findMatches(S.grid);
  if (!runs.length && who === 'ai') { swapCells(A, B); await settle(); return false; }
  if (gen !== S.gen) return false;
  await resolveBoard([key(A.r, A.c), key(B.r, B.c)], null, who);

}

function afterResolve() {
  if (!S.running) return;

  if (allMoves().length === 0) {

  }

}

function paceMultiplier() {
  let m = AI_SPEED * (S.level.speed || 1);
  if (S.level.infinite) m *= 1 + Math.min(1.6, S.time / 120);
  if (S.rush > 0) m *= 2;
  return m;
}
function updateAI(dt) {

  if (A.state === 'idle') {
    A.think -= dt;
    if (A.think <= 0 && !S.busy && S.aiLeft > 0) {
      const d = Math.min(1, S.time / AI_PACE.rampSeconds), m = paceMultiplier();
      A.interval = lerp(AI_PACE.thinkStart, AI_PACE.thinkEnd, d) / m;
      A.teleTime = lerp(AI_PACE.teleStart, AI_PACE.teleEnd, d) / m;
      A.aggression = lerp(AI_PACE.aggroStart, AI_PACE.aggroEnd, d);
      const mv = chooseMove();
      if (!mv) { afterResolve(); return; }
      A.plan = mv; A.state = 'tele'; A.tele = A.teleTime; A.wasLethal = mv.lethal; A.preview = mv;
      const F = S.finger; F.active = true; F.x = F.tx = mv.c1 + .5; F.y = F.ty = mv.r1 + .5;
      SFX.land();
    }
  } else if (A.state === 'tele') {
    A.tele -= dt;
    A.preview = S.busy ? null : evalSwap(A.plan.r1, A.plan.c1, A.plan.r2, A.plan.c2);
    if (A.tele <= 0 && !S.busy) { A.state = 'exec'; A.preview = null; aiExecute(); }
  }
}

async function aiExecute() {
  const A = S.ai, p = A.plan, gen = S.gen; S.busy = true; S.aiLeft--; S.aiMoves++;
  const info = S.glitch > 0 ? null : evalSwap(p.r1, p.c1, p.r2, p.c2);
  const P1 = { r: p.r1, c: p.c1 }, P2 = { r: p.r2, c: p.c2 };
  S.finger.tx = p.c2 + .5; S.finger.ty = p.r2 + .5;
  if (!info) {
    if (S.glitch > 0) SFX.glitch(); else SFX.swap();
    if (isOpen(p.r1, p.c1) && isOpen(p.r2, p.c2)) { swapCells(P1, P2); await settle(); await sleep(70); swapCells(P1, P2); await settle(); }
    else await sleep(160);
    if (gen !== S.gen) return;
    if (S.glitch > 0) floatText(p.c2 + .5, p.r2, 'GLITCHED', '#41b6ff'); else floatText(p.c2 + .5, p.r2, 'Missed!', '#ffffff');
    if (A.wasLethal) { S.dodges++; S.score += SCORE.dodge; }
    SFX.miss();
  } else {
    SFX.swap();
    if (A.wasLethal && !info.lethal) { S.dodges++; S.score += SCORE.dodge; const pl = findPlayer(); if (pl) floatText(pl.c + .5, pl.r, 'Dodged!', '#4ee089'); }
    await doSwap(P1, P2, 'ai');

  if (!S.dead) S.score += SCORE.aiSwipe;
  S.finger.active = false;
  S.busy = false;

function queueMove(dr, dc) { if (!S.running || S.dead) return; S.queued = { dr, dc, t: .4 }; }
async function playerMove(dr, dc) {
  const pl = findPlayer(); if (!pl) return;
  const r2 = pl.r + dr, c2 = pl.c + dc;
  S.lastDir = { dx: dc, dy: dr };
  if (!inb(r2, c2) || S.cells[r2][c2] === HOLE) { pl.g.squash = 1; SFX.bump(); return; }
  if (S.cells[r2][c2] !== OPEN) { pl.g.squash = 1; SFX.bump(); floatText(c2 + .5, r2, 'Locked', '#b9adde'); return; }
  const gen = S.gen; S.busy = true; S.playerCd = .1; SFX.swap();
  await doSwap({ r: pl.r, c: pl.c }, { r: r2, c: c2 }, 'player');
  if (gen !== S.gen) return;
  S.busy = false;
  afterResolve();
}

function grantPowerup() {
  const type = pick(Object.keys(POWERUPS));
  S.slots.push(type); SFX.power();
  floatText(COLS / 2, ROWS - 1.2, '+ ' + POWERUPS[type].name, '#ffd23f', true);
  renderSlots();
}
function usePowerup(i) {
  if (!S.running || S.dead || S.paused) return;
  const type = S.slots[i]; if (!type) return;
  if (type === 'shuffle' && S.busy) return;
  S.slots.splice(i, 1); renderSlots(); SFX.use();
  const pl = findPlayer();
  if (type === 'shield') S.shield = 6;
  else if (type === 'glitch') S.glitch = 5;
  else if (type === 'freeze') S.freeze = 4;
  else if (type === 'shuffle') shuffleBoard();
  if (pl) floatText(pl.c + .5, pl.r, POWERUPS[type].name + '!', '#ffd23f');
}
function shuffleBoard() {
  const cells = [], gems = [];
  forEachCell((r, c, g) => { if (!g.player && S.cells[r][c] === OPEN) { cells.push({ r, c }); gems.push(g); } });
  for (let tries = 0; tries < 60; tries++) {
    for (let i = gems.length - 1; i > 0; i--) { const j = rnd(i + 1); [gems[i], gems[j]] = [gems[j], gems[i]]; }
    cells.forEach((cell, i) => { S.grid[cell.r][cell.c] = gems[i]; });
    if (findMatches(S.grid).length === 0 && allMoves().length > 0) break;
  }
  S.busy = true; S.ai.preview = null; const gen = S.gen;
  settle().then(() => { if (gen !== S.gen) return; S.busy = false; afterResolve(); });
}

function spawnCage() {
  const cand = [];
  let caged = 0, open = 0;
  forEachCell((r, c, g) => { if (S.cells[r][c] === CAGE) caged++; if (S.cells[r][c] === OPEN) { open++; if (!g.player && !g.special && g.rx === c && g.ry === r) cand.push({ r, c }); } });
  if (!cand.length || caged >= open * .25) return;
  const pl = findPlayer();
  const far = cand.filter((x) => !pl || Math.abs(x.r - pl.r) + Math.abs(x.c - pl.c) > 1);
  const cell = pick(far.length ? far : cand);
  S.cells[cell.r][cell.c] = CAGE; S.grid[cell.r][cell.c].born = .5;
  floatText(cell.c + .5, cell.r, 'Caged!', '#b9adde'); SFX.cage();
}
function timedUnlock() {
  const locked = [];
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) if (isLocked(r, c)) locked.push({ r, c });
  if (!locked.length) return;
  const cell = pick(locked); unlockCell(cell.r, cell.c, true);
}
// Shapeshift: pick a new color for the player that does not instantly match. Returns false if none is safe right now.
function shapeshift() {
  const pl = findPlayer(); if (!pl) return true;
  const cur = pl.g.color, order = [];
  for (let i = 0; i < NCOL; i++) if (i !== cur) order.push(i);
  for (let i = order.length - 1; i > 0; i--) { const j = rnd(i + 1); [order[i], order[j]] = [order[j], order[i]]; }
  for (const col of order) {
    pl.g.color = col;
    const bad = findMatches(S.grid).some((run) => run.cells.some((x) => x.r === pl.r && x.c === pl.c));
    if (!bad) { pl.g.born = .7; floatText(pl.c + .5, pl.r, 'Shapeshift!', '#c77dff'); SFX.shift(); S.fx.push({ kind: 'ring', x: pl.c + .5, y: pl.r + .5, r0: .2, r1: 1.3, color: '#c77dff', t: 0, dur: .5 }); return true; }
  }
  pl.g.color = cur; return false;
}

  c.save(); c.globalAlpha = alpha; c.translate(x1, y1); c.rotate(ang);
  const L = Math.hypot(x2 - x1, y2 - y1); const w = CELL * .18;
  c.fillStyle = color; c.strokeStyle = '#1d1233'; c.lineWidth = 3; c.lineJoin = 'round';
  c.beginPath(); c.moveTo(CELL * .2, -w); c.lineTo(L - CELL * .38, -w); c.lineTo(L - CELL * .38, -w * 2.1); c.lineTo(L - CELL * .05, 0); c.lineTo(L - CELL * .38, w * 2.1); c.lineTo(L - CELL * .38, w); c.lineTo(CELL * .2, w); c.closePath(); c.fill(); c.stroke();
  c.restore();
}

function drawFx(c) {
  for (const f of S.fx) {
    const k = 1 - f.t;
    c.save(); c.globalCompositeOperation = 'lighter';
    if (f.kind === 'beam') {
      c.globalAlpha = .9 * k; c.lineCap = 'round';
      c.strokeStyle = f.color; c.lineWidth = CELL * .7 * k; c.beginPath(); c.moveTo(f.x1 * CELL, f.y1 * CELL); c.lineTo(f.x2 * CELL, f.y2 * CELL); c.stroke();
      c.strokeStyle = '#ffffff'; c.lineWidth = CELL * .25 * k; c.stroke();
    } else if (f.kind === 'ring') {
      const rad = lerp(f.r0, f.r1, 1 - k * k) * CELL;
      c.globalAlpha = .9 * k; c.strokeStyle = f.color; c.lineWidth = CELL * .35 * k; c.beginPath(); c.arc(f.x * CELL, f.y * CELL, rad, 0, Math.PI * 2); c.stroke();
      c.strokeStyle = '#ffffff'; c.lineWidth = CELL * .12 * k; c.stroke();
    } else if (f.kind === 'flash') {
      c.globalAlpha = .5 * k; c.fillStyle = f.color; c.fillRect(-20, -20, W + 40, H + 40);
    }
    c.restore();
  }
}

function render(t) {
  const c = ctx;
  c.setTransform(DPR, 0, 0, DPR, 0, 0);
  c.clearRect(0, 0, W, H);
  const pulse = .5 + .5 * Math.sin(t * 9);
  let shx = 0, shy = 0;
  if (S.shake > 0) { shx = (Math.random() - .5) * S.shake * 12; shy = (Math.random() - .5) * S.shake * 12; }
  c.translate(shx, shy);
  for (let r = 0; r < ROWS; r++) for (let cc = 0; cc < COLS; cc++) {
    const ty = S.cells[r][cc];
    if (ty === HOLE) continue;
    c.fillStyle = ty === OPEN ? ((r + cc) % 2 ? '#2a1f63' : '#312672') : '#231a52';
    roundRect(c, cc * CELL + 1.5, r * CELL + 1.5, CELL - 3, CELL - 3, CELL * .18); c.fill();
  }
  const A = S.ai, pv = A.preview, pl = findPlayer();
  let mood = 'happy', look = { dx: S.lastDir.dx * .6, dy: S.lastDir.dy * .6 };
  if (pv && A.state === 'tele') {
    for (const [k] of pv.clear) {
      const r = Math.floor(k / COLS), cc = k % COLS;
      const isPl = pl && r === pl.r && cc === pl.c;
      c.fillStyle = isPl ? 'rgba(255,59,92,' + (.35 + .35 * pulse) + ')' : 'rgba(255,210,63,' + (.14 + .1 * pulse) + ')';
      roundRect(c, cc * CELL + 1.5, r * CELL + 1.5, CELL - 3, CELL - 3, CELL * .18); c.fill();
    }
    if (pv.lethal && S.shield <= 0) mood = 'scared';
  }
  if (A.state === 'tele' && A.plan) {
    const p = A.plan;
    c.lineWidth = 3; c.strokeStyle = 'rgba(255,255,255,' + (.5 + .4 * pulse) + ')';
    for (const [r, cc] of [[p.r1, p.c1], [p.r2, p.c2]]) { roundRect(c, cc * CELL + 3, r * CELL + 3, CELL - 6, CELL - 6, CELL * .18); c.stroke(); }
  }
  if (S.finger.vis > .02 && pl) { look = { dx: Math.max(-1, Math.min(1, (S.finger.x - pl.c - .5) / 3)), dy: Math.max(-1, Math.min(1, (S.finger.y - pl.r - .5) / 3)) }; }
  if (S.shield > 0) mood = 'cool';
  if (S.dead) mood = 'dead';
  if (pl && S.shield > 0) {
    c.save(); c.globalAlpha = .35 + .25 * pulse; c.strokeStyle = '#ffd23f'; c.lineWidth = 5; c.setLineDash([10, 8]); c.lineDashOffset = -t * 40;
    c.beginPath(); c.arc((pl.c + .5) * CELL, (pl.r + .5) * CELL, CELL * .56, 0, Math.PI * 2); c.stroke(); c.restore();
  }
  const gs = CELL * .38;
  forEachCell((r, cc, g) => {
    const ty = S.cells[r][cc];
    const px = (g.rx + .5) * CELL, py = (g.ry + .5) * CELL;
    if (ty === FOG) { drawFog(c, px, py, CELL, t + g.wob); return; }
    const wob = g.player ? Math.sin(t * 3 + g.wob) * CELL * .02 : 0;
    drawGem(c, g, px, py + wob, gs, 1, g.player ? mood : null, look, t);
    if (ty === CAGE) drawCage(c, px, py, CELL);
  });
  for (const g of S.popping) drawGem(c, g, (g.rx + .5) * CELL, (g.ry + .5) * CELL, gs, 1, g.player ? 'dead' : null, look, t);
  drawFx(c);
  for (const p of S.particles) { c.globalAlpha = Math.max(0, p.life); c.fillStyle = p.color; c.beginPath(); c.arc(p.x * CELL, p.y * CELL, p.size * CELL, 0, Math.PI * 2); c.fill(); }
  c.globalAlpha = 1;
  // shapeshift countdown over the player's head
  if (pl && S.running && S.level.shiftEvery && S.shiftT <= 3) {
    c.save(); c.font = '700 ' + CELL * .42 + 'px Fredoka, Nunito, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
    c.lineWidth = 5; c.strokeStyle = '#1d1233'; c.lineJoin = 'round'; const tx = (pl.c + .5) * CELL, ty = (pl.r - .35) * CELL;
    c.strokeText(String(Math.ceil(S.shiftT)), tx, ty); c.fillStyle = '#c77dff'; c.fillText(String(Math.ceil(S.shiftT)), tx, ty); c.restore();
  }
  if (S.finger.vis > .02 && A.plan) {
    const p = A.plan;
    if (A.state === 'tele') drawArrow(c, (p.c1 + .5) * CELL, (p.r1 + .5) * CELL, (p.c2 + .5) * CELL, (p.r2 + .5) * CELL, (pv && pv.lethal) ? '#ff3b5c' : '#ffd23f', S.finger.vis * (.55 + .45 * pulse));
    let hx = S.finger.x * CELL, hy = S.finger.y * CELL, tint = '#ffffff';
    if (S.glitch > 0) { hx += (Math.random() - .5) * 10; hy += (Math.random() - .5) * 10; tint = Math.random() < .5 ? '#7ff0ff' : '#ff7fe6'; }
    if (S.freeze > 0) tint = '#bfe9ff';
    if (S.rush > 0) tint = '#ffb3c0';
    const bob = A.state === 'tele' ? Math.sin(t * 12) * 3 : 0;
    drawHand(c, hx + CELL * .1, hy + CELL * .05 + bob, S.finger.vis, CELL / 60, tint);
  }
  for (const f of S.floats) {
    c.save(); c.globalAlpha = 1 - f.t * f.t; c.font = '700 ' + (f.big ? CELL * .5 : CELL * .34) + 'px Fredoka, Nunito, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
    const fy = f.y * CELL - f.t * CELL * .8;
    c.lineWidth = 5; c.strokeStyle = '#1d1233'; c.lineJoin = 'round'; c.strokeText(f.text, f.x * CELL, fy); c.fillStyle = f.color; c.fillText(f.text, f.x * CELL, fy); c.restore();
  }
  if (S.freeze > 0) { c.fillStyle = 'rgba(160,220,255,.12)'; c.fillRect(-20, -20, W + 40, H + 40); }
  if (S.rush > 0) { c.fillStyle = 'rgba(255,59,92,' + (.06 + .05 * pulse) + ')'; c.fillRect(-20, -20, W + 40, H + 40); }
  if (S.glitch > 0) { c.fillStyle = 'rgba(65,182,255,.08)'; for (let y = (t * 200) % 8; y < H; y += 8) c.fillRect(0, y, W, 2); }
  updateHud();
}

// ============================================================
// BOOT
// ============================================================
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (!S.paused) update(dt);
  render(now / 1000);
  requestAnimationFrame(frame);
}
S.levelNum = Math.min(TOTAL_LEVELS, progress.beaten + 1); S.level = makeLevel(S.levelNum);
newBoard(); resize(); last = performance.now(); renderSlots();
document.addEventListener('visibilitychange', () => { if (document.hidden && S.running && !S.paused) togglePause(); });
showOverlay('start');
requestAnimationFrame(frame);
})();
</script>
